{% extends "layout.html" %}

{% block title %}Edit Customer{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/invoice-form.css') }}">
{% endblock %}

{% block content %}
<div class="invoice-container">
    <div class="header-actions">
        <h1><i class="fas fa-user-edit"></i> Edit Customer</h1>
        <a href="/customers" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to List
        </a>
    </div>

    <!-- Form Container -->
    <div class="invoice-master-card">
        <form id="customerForm">
            <input type="hidden" id="customer_id" value="{{ customer_id }}">

            <!-- 2-Column Grid -->
            <div class="master-grid">
                <!-- Left Column -->
                <div class="form-group">
                    <label for="name">Customer Name <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" required placeholder="Loading...">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="Loading...">
                    </div>
                </div>

                <!-- Right Column -->
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" required placeholder="Loading...">
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="tel" id="mobile" name="mobile" placeholder="Loading...">
                    </div>
                </div>
            </div>

            <!-- Full Width Address -->
            <div class="form-group" style="margin-top: 15px;">
                <label for="address">Address</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-map-marker-alt"></i>
                    <textarea id="address" name="address" rows="3" placeholder="Loading..."></textarea>
                </div>
            </div>

            <!-- Actions Footer -->
            <div class="totals-footer" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <div class="actions">
                    <button type="submit" class="btn btn-save">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="/customers" class="btn btn-cancel">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/customer-form.js') }}"></script>
{% endblock %}
