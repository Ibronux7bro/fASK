{% extends "layout.html" %}

{% block title %}Edit Product{% endblock %}

{% block extra_css %}
<!-- Reuse invoice form styles for consistency -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/invoice-form.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

{% block content %}

<div class="create-invoice-container">
    <h2><i class="fas fa-edit"></i> Edit Product</h2>

    <form id="productForm">
        <!-- Hidden ID for Edit Mode -->
        <input type="hidden" id="productId" value="{{ product_id }}">

        <!-- ================= MASTER SECTION ================= -->
        <div class="section">
            <h3>Product Details</h3>

            <div class="form-row">
                <label class="form-label">Product Name <span style="color:red">*</span></label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="Enter product name">
            </div>

            <div class="form-row">
                <label class="form-label">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3"
                    placeholder="Enter product description"></textarea>
            </div>

            <div class="master-grid" style="grid-template-columns: 1fr 1fr; gap: 20px; display: grid;">
                <div class="master-col">
                    <div class="form-row">
                        <label class="form-label">Price <span style="color:red">*</span></label>
                        <input type="number" id="price" name="price" class="form-control" step="0.01" min="0" required
                            placeholder="0.00" style="color: green; font-weight: bold;">
                    </div>
                </div>
                <div class="master-col">
                    <div class="form-row">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" id="stock_quantity" name="stock_quantity" class="form-control" min="0"
                            placeholder="0">
                    </div>
                </div>
            </div>

        </div>

        <!-- ================= ACTIONS ================= -->
        <div class="actions">
            <a href="/products" class="btn btn-cancel">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-save" id="saveBtn">
                <i class="fas fa-save"></i> Update Product
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/product-form.js') }}"></script>
{% endblock %}
