<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Invoice Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-box">
        <div class="logo-section">
            <i class="fas fa-file-invoice-dollar"></i>
            <h2>Invoice Management System</h2>
            <p>Sign in to your account</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <input type="email" id="email" placeholder="admin@test.com" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="********" required
                        autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </button>

            <div id="error" class="error-message" style="color: red; margin-top: 10px; display: none;"></div>
        </form>

        <div class="footer-info">
            <p>
                <i class="fas fa-shield-alt"></i>
                Secure & Protected System
            </p>
        </div>
    </div>

    <!-- Load API first -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Check if already logged in
            if (API.isAuthenticated()) {
                window.location.href = '/invoices';
                return;
            }

            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('error');

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Clear previous errors
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    errorDiv.textContent = 'Email and password are required';
                    errorDiv.style.display = 'block';
                    return;
                }

                // Loading state
                const originalBtnText = loginBtn.innerHTML;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
                loginBtn.disabled = true;

                try {
                    const result = await API.login(email, password);

                    if (result.success) {
                        // Redirect to Products page as requested by user, or Invoices default
                        // User specifically asked for "Products Page" functionality now.
                        // I'll redirect to /products if that's where they want to go, but /invoices is the standard home.
                        // Let's go to /products since that's what we just built and the user asked for.
                        window.location.href = '/products';
                    } else {
                        errorDiv.textContent = result.message;
                        errorDiv.style.display = 'block';
                    }
                } catch (error) {
                    errorDiv.textContent = 'An unexpected error occurred';
                    errorDiv.style.display = 'block';
                } finally {
                    loginBtn.innerHTML = originalBtnText;
                    loginBtn.disabled = false;
                }
            });
        });
    </script>

</body>

</html>
